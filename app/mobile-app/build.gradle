import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: "com.android.application"
apply plugin: 'com.google.devtools.ksp'
apply plugin: "dagger.hilt.android.plugin"
apply plugin: "com.google.gms.google-services"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    namespace "${rootProject.ext.namespace}.mobile"

    compileSdk 36

    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }

    buildFeatures {
        compose true
    }

    defaultConfig {
        minSdk          30
        targetSdk       36
        versionCode     1
        versionName     "1.0.0"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            if (file("keystore.properties").exists()) {
                def properties = new Properties()
                properties.load(new FileInputStream(file("keystore.properties")))

                storeFile file(properties["key.store.file"])
                storePassword properties["key.store.password"]
                keyAlias properties["key.alias.name"]
                keyPassword properties["key.alias.password"]
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    rootProject.file("proguard/mongs-release.pro"),
                    "proguard-rules.pro"
        }

        release {
            // R8 축소·최적화 활성화. keep 룰은 core:data-core 의 consumer-rules.pro 에 있다.
            // (app 모듈의 proguard-rules.pro 는 copyPrivate* 태스크가 덮어쓰므로 그곳에 두면 안 된다)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    rootProject.file("proguard/mongs-release.pro"),
                    "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.fromTarget(rootProject.ext.javaVersion.toString())
    }
}

dependencies {
    // core layer
    implementation project(":core:data-core")

    // presentation layer
    implementation project(":presentation:mobile-view-presentation")

    // service
    implementation "androidx.lifecycle:lifecycle-service:2.9.2"

    // dagger & hilt
    implementation group: "javax.inject", name: "javax.inject", version: "1"
    implementation "com.google.dagger:hilt-android:${rootProject.ext.hiltVersion}"
    ksp "com.google.dagger:dagger-compiler:${rootProject.ext.hiltVersion}"
    ksp "com.google.dagger:hilt-compiler:${rootProject.ext.hiltVersion}"

    // worker
    implementation "androidx.work:work-runtime-ktx:${rootProject.ext.workerVersion}"
    implementation "androidx.hilt:hilt-work:${rootProject.ext.hiltWorkerVersion}"
    ksp "androidx.hilt:hilt-compiler:${rootProject.ext.hiltWorkerVersion}"

    // fcm
    implementation platform("com.google.firebase:firebase-bom:${rootProject.ext.firebaseVersion}")
    implementation "com.google.firebase:firebase-messaging-ktx:${rootProject.ext.fcmVersion}"
}