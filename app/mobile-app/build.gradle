import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: "com.android.application"
apply plugin: 'com.google.devtools.ksp'
apply plugin: "dagger.hilt.android.plugin"
apply plugin: "com.google.gms.google-services"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

// configs 서브모듈에서 이 앱이 쓰는 파일들의 위치. 복사하지 않고 여기서 직접 참조한다.
def configDir = "$rootDir/configs/app/mobile-app"

android {
    namespace "${rootProject.ext.namespace}.mobile"

    compileSdk 36

    compileOptions {
        sourceCompatibility rootProject.ext.javaVersion
        targetCompatibility rootProject.ext.javaVersion
    }

    buildFeatures {
        compose true
    }

    // app_name 등 환경 무관 리소스. flavor 와 무관해 main 소스셋에 붙인다.
    sourceSets {
        main.res.srcDir "$configDir/res"
    }

    defaultConfig {
        minSdk          30
        targetSdk       36
        versionCode     1
        versionName     "1.0.0"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            // configs 에서 직접 읽는다. key.store.file 의 상대경로는 프로젝트 디렉토리
            // 기준으로 해석되므로(app/<module>/../../configs/...) 그대로 맞는다.
            def keystoreProps = file("$configDir/keystore.properties")
            if (keystoreProps.exists()) {
                def properties = new Properties()
                keystoreProps.withInputStream { properties.load(it) }

                storeFile file(properties["key.store.file"])
                storePassword properties["key.store.password"]
                keyAlias properties["key.alias.name"]
                keyPassword properties["key.alias.password"]
            } else {
                logger.warn("keystore.properties 없음 - release 가 unsigned 로 나온다: $keystoreProps")
            }
        }
    }

    buildTypes {
        debug {
            // minifyEnabled false 면 R8 이 돌지 않아 proguardFiles 는 무시된다.
            // 릴리스 룰을 여기 걸어두면 "디버그에서도 Log 가 지워지나?" 라는 오해만 만든다.
            minifyEnabled false
        }

        release {
            // R8 축소·최적화 활성화. 룰은 두 곳으로 나뉘어 있다.
            //  - proguard/mongs-release.pro          : 앱 전역 정책(난독화 속성, Log 제거, enum keep)
            //  - core/data-core/consumer-rules.pro   : 라이브러리 리플렉션 keep(Gson/Retrofit/MQTT)
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    rootProject.file("proguard/mongs-release.pro")
            signingConfig signingConfigs.release
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.fromTarget(rootProject.ext.javaVersion.toString())
    }
}

dependencies {
    // core layer
    implementation project(":core:auth-core")
    implementation project(":core:data-core")

    // presentation layer
    implementation project(":presentation:mobile-view-presentation")

    // service
    implementation "androidx.lifecycle:lifecycle-service:2.9.2"

    // dagger & hilt
    implementation group: "javax.inject", name: "javax.inject", version: "1"
    implementation "com.google.dagger:hilt-android:${rootProject.ext.hiltVersion}"
    ksp "com.google.dagger:dagger-compiler:${rootProject.ext.hiltVersion}"
    ksp "com.google.dagger:hilt-compiler:${rootProject.ext.hiltVersion}"

    // worker
    implementation "androidx.work:work-runtime-ktx:${rootProject.ext.workerVersion}"
    implementation "androidx.hilt:hilt-work:${rootProject.ext.hiltWorkerVersion}"
    ksp "androidx.hilt:hilt-compiler:${rootProject.ext.hiltWorkerVersion}"

    // fcm
    implementation platform("com.google.firebase:firebase-bom:${rootProject.ext.firebaseVersion}")
    implementation "com.google.firebase:firebase-messaging-ktx:${rootProject.ext.fcmVersion}"
}

// google-services 플러그인은 sourceSets 를 따르지 않고 모듈 디렉토리 기준으로만 json 후보 경로를
// 만든다(GoogleServicesPlugin$Companion.getJsonFiles(buildType, flavorNames, projectDir)).
// 다만 GoogleServicesTask.googleServicesJsonFiles 가 @InputFiles 로 노출된 public 프로퍼티라
// 복사 없이 configs 를 직접 가리킬 수 있다. @CacheableTask 이므로 up-to-date/빌드캐시도 정상이다.
// google-services.json 은 환경 공용이라 flavor 별로 나누지 않는다.
// gmsPluginVersion 을 올릴 때 이 배선이 유효한지 반드시 재확인해라.
//
// afterEvaluate 로 감싸는 게 핵심이다. 컨테이너 레벨 configureEach 액션은 태스크가 realize 될 때
// tasks.register(name) { ... } 의 설정 블록보다 "먼저" 돌아서, 여기서 값을 넣어도 플러그인이
// 곧바로 기본 탐색 경로로 덮어쓴다. afterEvaluate 시점엔 태스크가 이미 등록된 뒤라 우리가 이긴다.
afterEvaluate {
    tasks.withType(com.google.gms.googleservices.GoogleServicesTask).configureEach {
        googleServicesJsonFiles.set([file("$configDir/google-services.json")])
    }
}
