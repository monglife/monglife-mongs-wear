buildscript {
    ext {
        composeVersion          = "1.8.3"
        composeNavigateVersion  = "2.9.3"
        hiltNavigationVersion   = "1.2.0"
        materialVersion         = "1.7.6"
        coilVersion             = "2.7.0"
    }
}

apply plugin: "org.jetbrains.kotlin.plugin.compose"

android {
    namespace "${rootProject.ext.namespace}.presentation.view.mobile"

    buildFeatures {
        compose true
    }
}

composeCompiler {
    // application/viewmodel/domain 모듈의 VO 를 안정 타입으로 선언 (값 비교로 전환)
    stabilityConfigurationFiles.add(
        rootProject.layout.projectDirectory.file("compose_stability.conf")
    )

    // 리컴포지션 개선 계측용 리포트 (-PcomposeReports 를 붙였을 때만 생성)
    if (project.hasProperty("composeReports")) {
        reportsDestination = layout.buildDirectory.dir("compose-reports")
        metricsDestination = layout.buildDirectory.dir("compose-metrics")
    }
}

dependencies {
    // application layer
    api project(":presentation:viewmodel-presentation")

    // compose
    api "androidx.compose.material:material:${this.ext.composeVersion}"
    api "androidx.compose.foundation:foundation-layout:${this.ext.composeVersion}"
    api "androidx.navigation:navigation-compose:${this.ext.composeNavigateVersion}"
    implementation "androidx.compose.ui:ui:${this.ext.composeVersion}"

    implementation "androidx.hilt:hilt-navigation-compose:${this.ext.hiltNavigationVersion}"
    implementation "androidx.compose.ui:ui-tooling-preview:${this.ext.composeVersion}"
    implementation "androidx.compose.material:material-icons-extended:${this.ext.materialVersion}"
    debugImplementation "androidx.compose.ui:ui-tooling:${this.ext.composeVersion}"

    // coil (gif)
    implementation "io.coil-kt:coil-compose:${this.ext.coilVersion}"
    implementation "io.coil-kt:coil-gif:${this.ext.coilVersion}"
}