# 플러그인 버전의 단일 원본.
#
# 루트 build.gradle 의 ext 보간(id "..." version "${androidVersion}")은 쓰지 마라.
# lint 의 GroovyGradleVisitor 는 AST 를 평가하지 않고 소스 문자열을 offset 으로 잘라 읽어서
# 버전을 리터럴 "${androidVersion}" 으로 파싱한다. 그 값이 7.1.0 보다 낮다고 판정되어
# GradlePluginVersion(severity ERROR) 이 오검출된다.
# 카탈로그는 lint 가 TOML 로 직접 파싱하므로 검사가 정상 동작한다.
#
# 라이브러리 버전은 여기가 아니라 루트 build.gradle 의 ext 와 모듈별 buildscript.ext 에 있다.

[versions]
agp    = "9.3.1"
# org.jetbrains.kotlin.plugin.compose 는 Kotlin 과 같은 버전으로 릴리스된다.
# 하나로 묶어 두 버전이 어긋날 여지를 없앤다.
kotlin = "2.4.10"
ksp    = "2.3.11"
hilt   = "2.60.1"
gms    = "4.4.2"

[plugins]
android-library     = { id = "com.android.library",                 version.ref = "agp" }
android-application = { id = "com.android.application",             version.ref = "agp" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm",            version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp",             version.ref = "ksp" }
hilt-android        = { id = "com.google.dagger.hilt.android",      version.ref = "hilt" }
google-services     = { id = "com.google.gms.google-services",      version.ref = "gms" }
