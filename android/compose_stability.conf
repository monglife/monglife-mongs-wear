// Compose 안정성 설정
//
// application/*, viewmodel-presentation, domain/* 은 Compose 컴파일러가 적용되지 않는
// (또는 적용돼도 java.time 필드 때문에 추론이 실패하는) 모듈이라
// 그 안의 VO/모델이 전부 unstable 로 분류된다.
//
// 강한 스킵이 켜져 있어도 unstable 파라미터는 equals 가 아닌 인스턴스 비교(===)로 판정되므로,
// 엔진이 매 프레임 새 VO 를 만들거나 Room 이 같은 값을 재발행하면 내용이 같아도 항상 리컴포지션된다.
// 아래 타입들을 안정으로 선언해 값(equals) 비교로 전환한다.
//
// 전제: 여기 나열한 타입은 모두 불변(immutable) 이어야 한다.
//       (VO 는 val 프로퍼티만 가진 data class, domain 모델도 동일)
com.monglife.mongs.application.**
com.monglife.mongs.presentation.viewmodel.**
com.monglife.mongs.domain.**
// java.time 타입은 불변이지만 Compose 가 알지 못한다.
java.time.LocalDateTime
java.time.LocalTime
java.time.LocalDate
java.time.Duration
