buildscript {
    ext {
        namespace               = "com.mongs"
        javaVersion             = JavaVersion.VERSION_17
        androidVersion          = "9.3.1"
        kotlinVersion           = "2.4.10"
        kspVersion              = "2.3.11"
        hiltVersion             = "2.60.1"
        hiltWorkerVersion       = "1.4.0"
        workerVersion           = "2.10.3"
        lifecycleVersion        = "2.9.2"
        firebaseVersion         = "33.8.0"
        fcmVersion              = "24.1.2"
        gmsPluginVersion        = "4.4.2"
        gmsLocationVersion      = "21.3.0"
        jupiterVersion          = "4.13.2"
        mockitoVersion          = "5.19.0"
        mockitoKotlinVersion    = "6.0.0"
        composePluginVersion    = "2.4.10"
    }
}

plugins {
    id "com.android.library"                 version "${androidVersion}"        apply false
    id "com.android.application"             version "${androidVersion}"        apply false
    id "org.jetbrains.kotlin.jvm"            version "${kotlinVersion}"         apply false
    id "com.google.devtools.ksp"             version "${kspVersion}"            apply false
    id "com.google.dagger.hilt.android"      version "${hiltVersion}"           apply false
    id "com.google.gms.google-services"      version "${gmsPluginVersion}"      apply false
    id "org.jetbrains.kotlin.plugin.compose" version "${composePluginVersion}"  apply false
}

subprojects {
    // 환경 프로파일은 product flavor 로 가른다.
    //
    // core:data-core 가 flavor 를 가지면 이를 의존하는 data/*, presentation/*, app/* 도
    // 같은 dimension 을 선언해야 variant resolution 이 성립한다. Android 플러그인 적용
    // 지점이 app/*(각 모듈), data/* 와 presentation/*(각 그룹의 subprojects), core/*(각 모듈)
    // 로 흩어져 있어 여기서 plugins.withId 로 한 번에 거는 게 유일하게 중복 없는 방법이다.
    //
    // 여기서 선언한 순서가 IDE 기본 배리언트를 정한다(devDebug).
    // applicationIdSuffix 는 붙이지 마라 - google-services.json 의 package_name 이
    // com.mongs.wear / com.mongs.mobile 단일이라 processXGoogleServices 가 실패한다.
    plugins.withId("com.android.base") {
        android {
            flavorDimensions = ["profile"]
            productFlavors {
                dev { dimension "profile" }
                stg { dimension "profile" }
                prd { dimension "profile" }
            }
        }
    }
}
